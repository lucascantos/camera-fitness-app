<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the app paint under the notch / gesture bar;
         CSS then re-insets content via env(safe-area-inset-*). maximum-scale
         stops mobile browsers auto-zooming on input focus during a workout. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover"
    />
    <!-- Standalone/installed hints — colours the Android status bar and lets
         the app run chrome-less when launched from the home screen. -->
    <meta name="theme-color" content="#12101b" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="CamFitness" />
    <!-- vite-plugin-pwa injects the <link rel="manifest"> automatically at
         build time. iOS Safari doesn't reliably read the manifest's icons
         array for "Add to Home Screen", so the apple-touch-icon needs its
         own explicit tag. %BASE_URL% is Vite's placeholder for the
         configured `base` (the GitHub Pages sub-path in prod, "/" in dev). -->
    <link rel="icon" href="%BASE_URL%icons/icon-192.png" />
    <link rel="apple-touch-icon" href="%BASE_URL%icons/apple-touch-icon.png" />
    <title>Camera Fitness App</title>
  </head>
  <body class="bg-bg text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
