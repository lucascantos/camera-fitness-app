<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the app paint under the notch / gesture bar;
         CSS then re-insets content via env(safe-area-inset-*). maximum-scale
         stops mobile browsers auto-zooming on input focus during a workout. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover"
    />
    <!-- Standalone/installed hints — colours the Android status bar and lets
         the app run chrome-less when launched from the home screen. -->
    <meta name="theme-color" content="#12101b" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="CamFitness" />
    <!-- vite-plugin-pwa injects the <link rel="manifest"> automatically at
         build time. iOS Safari doesn't reliably read the manifest's icons
         array for "Add to Home Screen", so the apple-touch-icon needs its
         own explicit tag. %BASE_URL% is Vite's placeholder for the
         configured `base` (the GitHub Pages sub-path in prod, "/" in dev). -->
    <link rel="icon" type="image/png" href="%BASE_URL%icons/icon-192.png" />
    <link rel="apple-touch-icon" href="%BASE_URL%icons/apple-touch-icon.png" />
    <title>Camera Fitness App</title>
    <!-- Opening splash. Its first frame copies Android's launch screen for the
         installed app (one background colour, the maskable icon in a circle,
         centred), so the hand-off from Android to the page is invisible.
         src/splash.ts then plays the exit once the app is ready: the
         character fades, the corners fly off (easeInBack), the disc and the
         background give way to the theme's background, and the app shows.
         Keep --sp-bg equal to the manifest's background_color (vite.config.ts). -->
    <style>
      #splash {
        --sp-bg: #12101b;
        --sp-d: 160px;   /* Android 12+ splash: icon circle is 160dp across */
        position: fixed; inset: 0; z-index: 9999; overflow: hidden;
        background-color: var(--sp-bg);
        transition: background-color 600ms ease, opacity 300ms ease 550ms;
      }
      #splash .sp-icon {
        position: absolute; left: 50%; top: 50%;
        width: var(--sp-d); height: var(--sp-d);
        margin: calc(var(--sp-d) / -2) 0 0 calc(var(--sp-d) / -2);
      }
      #splash .sp-disc {
        position: absolute; inset: 0; border-radius: 50%; overflow: hidden;
        transition: opacity 600ms ease;
      }
      #splash .sp-bgart { display: block; width: 100%; height: 100%; }
      /* The artwork's 300-unit frame, shrunk to 68% as in the maskable icon
         (design/icon.svg → public/icons/icon-maskable-*.png).
         1cqw inside it = 3 of the icon's 300 units. */
      #splash .sp-frame { position: absolute; inset: 16%; container-type: size; }
      #splash .sp-char {
        position: absolute; inset: 0; width: 100%; height: 100%;
        transition: opacity 350ms ease-out, transform 350ms ease-out;
      }
      /* The corners zoom out together from the icon's centre. easeInBack
         drives a zoom level --sp-z (0 → 1) and the scale is 14^z, so the
         wind-up is a small squeeze (14^-0.1 ≈ 0.77) instead of the corners
         collapsing, and the flight reads as a steady zoom past the viewer. */
      @property --sp-z { syntax: "<number>"; inherits: false; initial-value: 0; }
      #splash .sp-corners {
        position: absolute; inset: 0;
        --sp-z: 0;
        transform: scale(pow(14, var(--sp-z)));
        transition: --sp-z 600ms cubic-bezier(0.36, 0, 0.66, -0.56);
      }
      /* Three corners carry the design's drop shadow (offset 4, std-dev 2 in
         icon units); bottom-left has none, as in the source. */
      #splash .sp-c { position: absolute; width: 40%; height: 40%; }
      #splash .tl, #splash .tr, #splash .br {
        filter: drop-shadow(0 1.333cqw 1.333cqw rgba(0, 0, 0, 0.25));
      }
      #splash .sp-c::before, #splash .sp-c::after {
        content: ""; position: absolute; background: #00fe00;
      }
      #splash .sp-c::before { width: 100%; height: 16.667%; }
      #splash .sp-c::after  { height: 100%; width: 16.667%; }
      #splash .tl { top: 1.667%; left: 1.667%; }
      #splash .tr { top: 1.667%; right: 1.667%; }
      #splash .bl { bottom: 1.667%; left: 1.667%; }
      #splash .br { bottom: 1.667%; right: 1.667%; }
      #splash .tl::before, #splash .tl::after { top: 0; left: 0; }
      #splash .tr::before, #splash .tr::after { top: 0; right: 0; }
      #splash .bl::before, #splash .bl::after { bottom: 0; left: 0; }
      #splash .br::before, #splash .br::after { bottom: 0; right: 0; }

      #splash.sp-exit { background-color: rgb(var(--bg, 240 240 245)); opacity: 0; pointer-events: none; }
      #splash.sp-exit .sp-disc { opacity: 0; }
      #splash.sp-exit .sp-char { opacity: 0; transform: scale(1.08); }
      #splash.sp-exit .sp-corners { --sp-z: 1; }
      /* Reduced motion: everything fades in place, nothing flies. */
      @media (prefers-reduced-motion: reduce) {
        #splash.sp-exit .sp-corners { --sp-z: 0; opacity: 0; transition: opacity 300ms ease; }
        #splash.sp-exit .sp-char { transform: none; }
      }
    </style>
  </head>
